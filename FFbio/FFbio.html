<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 اردو اقوال</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#0f172a;
  --card:rgba(255,255,255,0.06);
  --text:#fff;
  --border:rgba(34,197,94,0.35);
}

body.light{
  --bg:#f1f5f9;
  --card:#fff;
  --text:#111827;
  --border:#22c55e;
}

body{
  margin:0;
  font-family:'Noto Nastaliq Urdu', serif;
  background:var(--bg);
  color:var(--text);
}

.main{padding:15px;}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#menuBtn{
  font-size:22px;
  background:none;
  border:none;
  color:var(--text);
  cursor:pointer;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

#search{
  width:100%;
  margin:15px 0;
  padding:10px;
  border-radius:10px;
  border:none;
}

/* CARD */
.card{
  margin-top:15px;
  padding:15px;
  border-radius:15px;
  background:var(--card);
  border:1px solid var(--border);
  position:relative;
}

.text{
  margin-top:40px;
  line-height:2;
}

.actionBox{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:12px;
}

.actionBox button{
  background:none;
  border:none;
  color:var(--text);
  font-size:18px;
  cursor:pointer;
}

/* DRAWER */
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
}

#overlay.show{display:block;}

.drawer{
  position:fixed;
  top:0;
  right:0;
  width:220px;
  height:70%;
  background:#111827;
  border-radius:35px 0 0 35px;
  transform:translateX(100%);
  transition:0.35s;
  padding-top:60px;
}

.drawer.open{transform:translateX(0);}

#closeBtn{
  position:absolute;
  top:15px;
  left:15px;
  background:none;
  border:none;
  color:#22c55e;
  font-size:22px;
  cursor:pointer;
}

.menuItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  color:#22c55e;
  text-decoration:none;
}

#themeIcon,#musicIcon{
  transition:0.4s;
}

/* TOAST */
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:#000;
  padding:10px;
  border-radius:10px;
  opacity:0;
  transition:0.3s;
}

#toast.show{opacity:1;}
</style>
</head>

<body>

<div class="main">

  <div class="header">
    <button id="menuBtn" onclick="openDrawer()">☰</button>
    <div class="title">اردو اقوال</div>
  </div>

  <input id="search" placeholder="اقوال تلاش کریں..." oninput="searchQuotes()">

  <div id="container"></div>

</div>

<div id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <button id="closeBtn" onclick="closeDrawer()">✖</button>

  <a href="#" class="menuItem" onclick="showAll()">📜 تمام اقوال</a>
  <a href="#" class="menuItem" onclick="showFavs()">❤️ پسندیدہ</a>

  <a href="#" class="menuItem" onclick="toggleTheme()">
    <i id="themeIcon" class="fas fa-moon"></i> نائٹ موڈ
  </a>

  <a href="#" class="menuItem" onclick="toggleMusic()">
    <i id="musicIcon" class="fas fa-play"></i> میوزک
  </a>
  
<a href="https://gullnoor596-svg.github.io/Help-us/" target="_blank" class="menuItem">
  <i class="fas fa-headset"></i> سپورٹ
</a>

</div>

<div id="toast"></div>
