<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GULL KHAN</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Arial, sans-serif;
    background:#000;
    color:white;
}

/* Particle background */
#particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* Main container */
.container{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

/* Floating image animation */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

/* Profile box */
.square-box{
    width:220px;
    height:220px;
    border:4px solid red;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 25px red;
    animation: float 3s ease-in-out infinite;
}

.square-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Name */
.name{
    margin-top:15px;
    font-size:26px;
    font-weight:bold;
    letter-spacing:3px;
    color:red;
    text-shadow:0 0 10px red;
}

/* Buttons container */
.links{
    margin-top:25px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* BUTTON STYLE */
.links a{
    text-decoration:none;
    padding:12px 20px;
    width:220px;
    border-radius:10px;
    color:white;
    font-weight:bold;
    border:1px solid red;
    position:relative;
    overflow:hidden;
    transition: box-shadow 0.3s ease;
}

/* Colors */
.whatsapp{background:#25D366;}
.facebook{background:#1877F2;}
.tiktok{background:#000;}
.email{background:#D44638;}

/* Hover glow only */
.links a:hover{
    box-shadow:0 0 20px red;
}

/* ❌ NO SCALE / NO SIZE CHANGE */
.links a:active{
    transform:none;
}

/* WHITE SHINE EFFECT */
.links a::after{
    content:"";
    position:absolute;
    top:0;
    left:-80%;
    width:60%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.85),
        transparent
    );
    transform:skewX(-25deg);
}

/* animation trigger */
.links a:active::after{
    animation: whiteShine 0.6s ease;
}

@keyframes whiteShine{
    0% { left:-80%; }
    100% { left:130%; }
}
</style>

</head>
<body>

<canvas id="particles"></canvas>

<div class="container">

    <div class="square-box">
        <img src="https://raw.githubusercontent.com/gullnoor596-svg/Help-us/refs/heads/main/FB_IMG_1776305403220.jpg">
    </div>

    <div class="name">GULL KHAN</div>

    <div class="links">
        <a class="whatsapp" href="https://whatsapp.com/channel/0029VbECKhYEVccHwLmVYb2u">WhatsApp</a>
        <a class="facebook" href="https://facebook.com" target="_blank">Facebook</a>
        <a class="tiktok" href="https://www.tiktok.com/@pathanwala1?_r=1&_t=ZS-96JrAMuq4vN" target="_blank">TikTok</a>
        <a class="email" href="mailto:ffbiomaker@gmail.com">Email</a>
    </div>

</div>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;

        if(this.x < 0) this.x = canvas.width;
        if(this.x > canvas.width) this.x = 0;
        if(this.y < 0) this.y = canvas.height;
        if(this.y > canvas.height) this.y = 0;
    }
    draw(){
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init(){
    particlesArray = [];
    for(let i=0;i<80;i++){
        particlesArray.push(new Particle());
    }
}

function connect(){
    for(let a=0;a<particlesArray.length;a++){
        for(let b=a;b<particlesArray.length;b++){
            let dx = particlesArray[a].x - particlesArray[b].x;
            let dy = particlesArray[a].y - particlesArray[b].y;
            let distance = Math.sqrt(dx*dx + dy*dy);

            if(distance < 120){
                ctx.strokeStyle = "rgba(255,0,0,0.2)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                ctx.stroke();
            }
        }
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<particlesArray.length;i++){
        particlesArray[i].update();
        particlesArray[i].draw();
    }

    connect();
    requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener("resize",function(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
});
</script>

</body>
</html>
